[project]
name = "agents-fuel-gauge"
version = "0.14.1"
description = "One-screen fuel gauge for Claude Code and Codex subscription limits, including the per-model scoped caps other tools drop."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ItsumiMario" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "codex", "usage", "quota", "tui", "rate-limit"]
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "textual-plotext>=1.0.1",
]

[project.scripts]
agents-fuel-gauge = "agents_fuel_gauge.cli:main"
afg = "agents_fuel_gauge.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "cairosvg>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_fuel_gauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
